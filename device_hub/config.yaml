name: Device Hub
version: "0.1.21"
slug: device_hub
description: Tuya, Tuya Local, Zigbee2MQTT, ZHA and LAN devices on one screen
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8765
ingress_panel: true
panel_icon: mdi:devices
panel_title: Device Hub
panel_admin: true
host_network: true
host_dbus: true
host_pid: true
privileged:
  - NET_RAW
  - NET_ADMIN
  - SYS_ADMIN
homeassistant_api: true
hassio_api: true
hassio_role: manager
services:
  - mqtt:want
options:
  tuya_access_id: ""
  tuya_access_secret: ""
  tuya_region: "eu"
schema:
  tuya_access_id: "str?"
  tuya_access_secret: "password?"
  tuya_region: "list(eu|eu-w|us|us-e|in|sg|cn)"
